<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Expo Expert Skills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111B2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#7C6CF0"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#16233A"/>
      <stop offset="1" stop-color="#0D1626"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>

  <!-- Ambient glow -->
  <circle cx="940" cy="300" r="260" fill="url(#glow)" filter="url(#soft)"/>

  <!-- Left: text -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="90" y="250" fill="#7C6CF0" font-size="26" font-weight="700" letter-spacing="4">EXPO · REACT NATIVE · AI</text>
    <text x="88" y="348" fill="#F8FAFC" font-size="76" font-weight="800" letter-spacing="-1">Expo Expert Skills</text>
    <text x="90" y="404" fill="#94A3B8" font-size="26" font-weight="400">Professional agent skills for Expo and React Native</text>
    <text x="90" y="440" fill="#94A3B8" font-size="26" font-weight="400">development — built for real-device verification.</text>
  </g>

  <!-- Right: phone + component cards -->
  <g>
    <!-- Phone frame -->
    <rect x="812" y="132" width="264" height="432" rx="34" fill="url(#phone)" stroke="#27354F" stroke-width="2"/>
    <rect x="836" y="162" width="216" height="372" rx="14" fill="#0B1220" stroke="#1E2A42" stroke-width="1"/>
    <!-- Phone notch -->
    <rect x="918" y="146" width="52" height="10" rx="5" fill="#27354F"/>

    <!-- Phone screen: component rows -->
    <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1">
      <path d="M852 196H1036M852 232H1036M852 268H1036M852 304H1036"/>
    </g>
    <rect x="852" y="180" width="120" height="10" rx="5" fill="#38BDF8"/>
    <rect x="852" y="216" width="184" height="10" rx="5" fill="#27354F"/>
    <rect x="852" y="252" width="150" height="10" rx="5" fill="#27354F"/>
    <rect x="852" y="288" width="168" height="10" rx="5" fill="#27354F"/>

    <!-- QR motif -->
    <rect x="852" y="330" width="92" height="92" rx="10" fill="#111B2E" stroke="#27354F" stroke-width="1"/>
    <g fill="#38BDF8">
      <rect x="864" y="342" width="14" height="14" rx="2"/>
      <rect x="882" y="342" width="14" height="14" rx="2"/>
      <rect x="900" y="342" width="14" height="14" rx="2"/>
      <rect x="918" y="342" width="14" height="14" rx="2"/>
      <rect x="864" y="360" width="14" height="14" rx="2"/>
      <rect x="900" y="360" width="14" height="14" rx="2"/>
      <rect x="918" y="360" width="14" height="14" rx="2"/>
      <rect x="864" y="378" width="14" height="14" rx="2"/>
      <rect x="882" y="378" width="14" height="14" rx="2"/>
      <rect x="900" y="378" width="14" height="14" rx="2"/>
      <rect x="918" y="378" width="14" height="14" rx="2"/>
      <rect x="864" y="396" width="14" height="14" rx="2"/>
      <rect x="882" y="396" width="14" height="14" rx="2"/>
      <rect x="900" y="396" width="14" height="14" rx="2"/>
      <rect x="918" y="396" width="14" height="14" rx="2"/>
    </g>
    <text x="962" y="384" fill="#94A3B8" font-size="20" font-family="ui-sans-serif, system-ui, sans-serif">Expo Go</text>
    <text x="962" y="410" fill="#64748B" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">real-device</text>

    <!-- Floating component card -->
    <rect x="686" y="232" width="188" height="84" rx="14" fill="#111B2E" stroke="#27354F" stroke-width="1.5"/>
    <rect x="706" y="252" width="92" height="10" rx="5" fill="#7C6CF0"/>
    <rect x="706" y="274" width="148" height="8" rx="4" fill="#27354F"/>
    <rect x="706" y="290" width="116" height="8" rx="4" fill="#27354F"/>

    <!-- Sparkles -->
    <g fill="url(#accent)">
      <path d="M800 172l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
      <path d="M1092 486l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    </g>
  </g>
</svg>
